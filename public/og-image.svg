    </text>
  </g>

  <!-- Bottom Proof Line -->
  <g transform="translate(80, 550)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#232A31" stroke-width="1"/>
    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8E9B97">
