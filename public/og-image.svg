<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="80%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0C0F12" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0C0F12" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF2F1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0C0F12"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Subtle coordinate grid -->
  <g stroke="#1F262D" stroke-width="1" opacity="0.4">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Brand Wordmark -->
  <g transform="translate(80, 80)">
    <rect width="48" height="48" rx="12" fill="#151A1E" stroke="#2DD4BF" stroke-width="1.5"/>
    <path d="M14 36L24 16L34 36H28L24 28L20 36H14Z" fill="#2DD4BF"/>
    <text x="64" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#EEF2F1" letter-spacing="-0.03em">
      Techonrise<tspan fill="#2DD4BF">.</tspan>
    </text>
  </g>

  <!-- Top Badge -->
  <g transform="translate(820, 80)">
    <rect width="300" height="40" rx="20" fill="#151A1E" stroke="#232A31" stroke-width="1"/>
    <circle cx="20" cy="20" r="4" fill="#2DD4BF"/>
    <text x="34" y="25" font-family="monospace" font-size="12" font-weight="600" fill="#2DD4BF" letter-spacing="0.05em">
      MANCHESTER HQ &amp; NATIONWIDE
    </text>
  </g>

  <!-- Hero Content -->
  <g transform="translate(80, 220)">
    <text x="0" y="0" font-family="monospace" font-size="15" font-weight="600" fill="#2DD4BF" letter-spacing="0.1em">
      GROW · AUTOMATE · MODERNISE
    </text>
    <text x="0" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.03em">
      Grow, Automate &amp; Modernise
    </text>
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="#2DD4BF" letter-spacing="-0.03em">
