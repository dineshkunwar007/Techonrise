<!doctype html>
<html lang="en-GB" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Techonrise | Digital Transformation, SEO & AI Automation</title>
    <meta name="description" content="Techonrise helps businesses grow, automate and modernise through SEO, websites, software, mobile apps, cloud infrastructure and practical AI automation." />
    
    <!-- Open Graph & Social Cards -->
    <meta property="og:site_name" content="Techonrise" />
    <meta property="og:title" content="Techonrise | Digital Transformation, SEO & AI Automation" />
    <meta property="og:description" content="Techonrise helps businesses grow, automate and modernise through SEO, websites, software, mobile apps, cloud infrastructure and practical AI automation." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Techonrise | Digital Transformation, SEO & AI Automation" />
    <meta name="twitter:description" content="Techonrise helps businesses grow, automate and modernise through SEO, websites, software, mobile apps, cloud infrastructure and practical AI automation." />
    
    <!-- Favicon & Web App Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Google Fonts: Bricolage Grotesque & Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Google Consent Mode v2 Baseline Stub (Strict Consent-First: Denied by Default) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        wait_for_update: 500
      });
    </script>

    <!-- Anti-FOUC Theme Script -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('techonrise_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-canvas text-main antialiased selection:bg-accent/30 selection:text-accent transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
